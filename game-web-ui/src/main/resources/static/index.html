<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <meta name="description" content="">
    <title>SnakeForged</title>
    <style>
        /* ── Reset ─────────────────────────────────────────────────────────── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        /* ── Screen-reader-only utility ────────────────────────────────────── */
        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border: 0;
        }

        /* ── Skip navigation ───────────────────────────────────────────────── */
        .skip-link {
            position: absolute;
            top: -100%;
            left: 0;
            background: #1a56db;
            color: #fff;
            padding: 0.75rem 1.5rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 0 0 6px 0;
            z-index: 9999;
            font-size: 1rem;
        }
        .skip-link:focus { top: 0; }

        /* ── Focus ring – visible for keyboard users ───────────────────────── */
        :focus-visible {
            outline: 3px solid #1a56db;
            outline-offset: 3px;
        }

        /* ── Design tokens (WCAG AA – all tested ≥ 4.5:1 on their bg) ──────── */
        :root {
            --color-bg:         #f3f4f6;     /* page background              */
            --color-surface:    #ffffff;     /* card / panel background      */
            --color-primary:    #1e40af;     /* 7.4:1 on #fff                */
            --color-primary-dk: #1e3a8a;     /* 9.3:1 on #fff                */
            --color-accent:     #166534;     /* 7.5:1 on #dcfce7             */
            --color-text:       #111827;     /* 16.8:1 on #fff               */
            --color-muted:      #374151;     /* 10.4:1 on #fff               */
            --color-subtle:     #6b7280;     /* 4.6:1 on #fff ✓ AA           */
            --color-border:     #d1d5db;
            --color-danger:     #b91c1c;     /* 7.0:1 on #fff                */
            --color-success:    #15803d;     /* 5.1:1 on #fff                */
            --radius:           10px;
            --shadow:           0 4px 24px rgba(0,0,0,.12);
        }

        /* ── High-contrast overrides ───────────────────────────────────────── */
        body.high-contrast {
            --color-bg:         #000;
            --color-surface:    #000;
            --color-primary:    #ffff00;     /* 19.6:1 on #000               */
            --color-primary-dk: #ffd700;
            --color-text:       #ffffff;     /* 21:1  on #000                */
            --color-muted:      #ffffff;
            --color-subtle:     #e5e5e5;
            --color-border:     #ffffff;
            --color-danger:     #ff6b6b;
            --color-success:    #6bff6b;
        }
        body.high-contrast .container    { border: 2px solid #fff; }
        body.high-contrast canvas        { border: 2px solid #fff; }
        body.high-contrast button,
        body.high-contrast input         { border: 2px solid #fff; }
        body.high-contrast a             { color: #ffff00; }
        body.high-contrast :focus-visible { outline-color: #ffff00; }

        /* ── Layout ────────────────────────────────────────────────────────── */
        body {
            background: var(--color-bg);
            color: var(--color-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem;
        }

        /* ── Top toolbar (always visible) ──────────────────────────────────── */
        .toolbar {
            width: 100%;
            max-width: 560px;
            display: flex;
            justify-content: flex-end;
            padding: 0.5rem 0;
            margin-bottom: 0.5rem;
        }

        /* ── Generic button ─────────────────────────────────────────────────── */
        button {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            padding: 0.6rem 1.25rem;
            transition: background 0.15s, transform 0.1s;
        }
        button:active { transform: scale(0.97); }

        .btn-primary {
            background: var(--color-primary);
            color: #fff;
        }
        .btn-primary:hover { background: var(--color-primary-dk); }

        .btn-secondary {
            background: var(--color-surface);
            color: var(--color-text);
            border: 1px solid var(--color-border);
        }
        .btn-secondary:hover { background: var(--color-bg); }

        .btn-danger {
            background: var(--color-danger);
            color: #fff;
        }

        /* High-contrast toggle pill */
        #contrast-toggle {
            background: var(--color-surface);
            color: var(--color-text);
            border: 2px solid var(--color-border);
            border-radius: 999px;
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        #contrast-toggle[aria-pressed="true"] {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
        }

        /* ── Card container ─────────────────────────────────────────────────── */
        .container {
            background: var(--color-surface);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 560px;
        }

        /* ── Headings ───────────────────────────────────────────────────────── */
        h1 {
            font-size: 2.25rem;
            color: var(--color-primary);   /* 7.4:1 on white */
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }
        h2 { font-size: 1.6rem; color: var(--color-text); margin-bottom: 0.75rem; }

        .subtitle {
            color: var(--color-muted);
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
            line-height: 1.55;
        }

        /* ── Difficulty fieldset ────────────────────────────────────────────── */
        .difficulty-group {
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 1rem 1.25rem 1.25rem;
            margin-bottom: 1.5rem;
        }
        .difficulty-group legend {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--color-muted);
            padding: 0 0.4rem;
        }
        .difficulty-options {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.75rem;
            flex-wrap: wrap;
        }
        .difficulty-options label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            font-weight: 600;
            color: var(--color-text);
            padding: 0.35rem 0.5rem;
            border-radius: 4px;
        }
        .difficulty-options label:has(input:checked) {
            background: #dbeafe;
            color: var(--color-primary);
        }
        body.high-contrast .difficulty-options label:has(input:checked) {
            background: #333;
            color: var(--color-primary);
        }
        .difficulty-options input[type="radio"] {
            accent-color: var(--color-primary);
            width: 1.1rem; height: 1.1rem;
        }

        /* ── Game screen ────────────────────────────────────────────────────── */
        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .score-panel {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }
        .score-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-muted);
            text-transform: uppercase;
            letter-spacing: .06em;
        }
        #score-value {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--color-primary);
        }
        .game-controls { display: flex; gap: 0.5rem; }

        canvas {
            display: block;
            width: 100%;
            max-width: 480px;
            /* aspect-ratio fallback for browsers that predate the property */
            aspect-ratio: 1 / 1;
            border-radius: var(--radius);
            background: #0f172a;
            margin: 0 auto;
            /* Prevent touch events from triggering scroll / zoom on the canvas */
            touch-action: none;
            -ms-touch-action: none;
        }

        .keyboard-hint {
            margin-top: 0.75rem;
            font-size: 0.82rem;
            color: var(--color-subtle);
            text-align: center;
        }

        /* ── Game over / win ────────────────────────────────────────────────── */
        .result-icon { font-size: 3rem; margin-bottom: 0.5rem; display: block; }

        .final-score-block {
            background: var(--color-bg);
            border-radius: var(--radius);
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
        }
        .final-score-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--color-primary);
        }
        .final-score-caption {
            font-size: 0.85rem;
            color: var(--color-subtle);
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        /* ── Submit form ────────────────────────────────────────────────────── */
        .submit-form { margin: 1.25rem 0; }
        .submit-form label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--color-muted);
            margin-bottom: 0.4rem;
        }
        .input-row { display: flex; gap: 0.5rem; }
        .submit-form input[type="text"] {
            flex: 1;
            padding: 0.55rem 0.85rem;
            border: 1.5px solid var(--color-border);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--color-text);
            background: var(--color-surface);
        }
        .submit-form input[type="text"]:focus {
            outline: 3px solid var(--color-primary);
            outline-offset: 1px;
            border-color: var(--color-primary);
        }
        #submit-status {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            min-height: 1.4em;
        }
        #submit-status.success { color: var(--color-success); }
        #submit-status.error   { color: var(--color-danger);  }

        .action-row {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .action-row button { flex: 1; min-width: 10rem; }

        /* ── Hidden screens ─────────────────────────────────────────────────── */
        [hidden] { display: none !important; }

        /*
         * ── CSS :has() fallback ──────────────────────────────────────────────
         * The .checked class is added by JS for browsers that do not yet
         * support the :has() pseudo-class (older Firefox / Safari versions).
         */
        .difficulty-options label.checked {
            background: #dbeafe;
            color: var(--color-primary);
        }
        body.high-contrast .difficulty-options label.checked {
            background: #333;
            color: var(--color-primary);
        }

        /* ── Touch-friendly tap targets (min 44×44 px, per WCAG 2.5.5) ──────── */
        @media (pointer: coarse) {
            button           { min-height: 44px; }
            .difficulty-options label { min-height: 44px; padding: 0.5rem 0.75rem; }
        }

        /* ── Responsive: 320px – 480px (phones) ─────────────────────────────── */
        @media (max-width: 480px) {
            body            { padding: 0.5rem; }
            .container      { padding: 1.25rem; border-radius: 8px; }
            h1              { font-size: 1.75rem; }
            h2              { font-size: 1.3rem; }
            .subtitle       { font-size: 0.95rem; }
            .action-row button { min-width: 0; }
            /* Stack nickname input + submit on very narrow viewports */
            .input-row      { flex-direction: column; }
            .input-row button { width: 100%; }
            .game-controls button { padding: 0.5rem 0.85rem; font-size: 0.9rem; }
            .keyboard-hint  { display: none; } /* Arrow keys unavailable on mobile */
        }

        /* ── Responsive: 481px – 768px (tablets / small laptops) ──────────── */
        @media (min-width: 481px) and (max-width: 768px) {
            .container { padding: 1.5rem; }
        }

        /* ── Wide screens: 1920px – centre and cap at comfortable width ──────── */
        @media (min-width: 1280px) {
            body { padding: 2rem; }
        }
    </style>
</head>
<body>

    <!-- Skip to content link (Tab from address bar) -->
    <a href="#main-content" class="skip-link" data-i18n="skip.toMain"></a>

    <!--
        ARIA live regions – visually hidden; announced by screen readers.
        score-announcer: polite (non-interrupting, for score updates)
        game-announcer:  assertive (interrupts, for Game Over / You Win)
    -->
    <div id="score-announcer" aria-live="polite"   aria-atomic="true" class="sr-only"></div>
    <div id="game-announcer"  aria-live="assertive" aria-atomic="true" class="sr-only"></div>

    <!-- ── Persistent toolbar ──────────────────────────────────────────────── -->
    <div class="toolbar" role="toolbar" data-i18n-aria-label="toolbar.ariaLabel">
        <button id="contrast-toggle"
                type="button"
                aria-pressed="false"
                data-i18n-title="toolbar.contrastTitle">
            <span aria-hidden="true">◑</span>
            <span data-i18n="toolbar.contrastVisibleLabel"></span>
        </button>
    </div>

    <!-- ── Main content ────────────────────────────────────────────────────── -->
    <main id="main-content">

        <!-- ═══ START SCREEN ════════════════════════════════════════════════ -->
        <section id="screen-start"
                 class="container"
                 data-i18n-aria-label="screen.start.ariaLabel">
            <h1 data-i18n="start.title"></h1>
            <p class="subtitle" data-i18n="start.tagline"></p>

            <fieldset class="difficulty-group">
                <legend data-i18n="difficulty.legend"></legend>
                <div class="difficulty-options">
                    <label>
                        <input type="radio" name="difficulty" value="EASY" checked>
                        <span data-i18n="difficulty.easyOption"></span>
                    </label>
                    <label>
                        <input type="radio" name="difficulty" value="MEDIUM">
                        <span data-i18n="difficulty.mediumOption"></span>
                    </label>
                    <label>
                        <input type="radio" name="difficulty" value="HARD">
                        <span data-i18n="difficulty.hardOption"></span>
                    </label>
                </div>
            </fieldset>

            <button id="btn-start" type="button" class="btn-primary" style="width:100%;font-size:1.15rem;padding:.8rem 0;" data-i18n="start.button">
            </button>
        </section>

        <!-- ═══ GAME SCREEN ══════════════════════════════════════════════════ -->
        <section id="screen-game"
                 class="container"
                 hidden
                 data-i18n-aria-label="game.screenAriaLabel">

            <div class="game-header">
                <div class="score-panel">
                    <span class="score-label" id="score-label" data-i18n="score.label"></span>
                    <span id="score-value"
                          aria-labelledby="score-label"
                          aria-live="off">0</span>
                </div>
                <div class="game-controls">
                    <button id="btn-pause"
                            type="button"
                            class="btn-secondary"
                            aria-pressed="false"
                            data-i18n="game.pauseInitial">
                    </button>
                    <button id="btn-quit" type="button" class="btn-danger" data-i18n="game.quit"></button>
                </div>
            </div>

            <!--
                Canvas role="application": allows arrow keys to reach the game
                without being intercepted by the browser's scroll behaviour.
                aria-label gives screen-reader users context.
            -->
            <canvas id="game-canvas"
                    width="480"
                    height="480"
                    role="application"
                    data-i18n-aria-label="canvas.ariaLabel"
                    tabindex="0">
                <span data-i18n="canvas.fallbackText"></span>
            </canvas>

            <p class="keyboard-hint" aria-hidden="true" data-i18n="keyboard.hintsHidden">
            </p>
        </section>

        <!-- ═══ GAME OVER / WIN SCREEN ═══════════════════════════════════════ -->
        <section id="screen-result"
                 class="container"
                 hidden
                 data-i18n-aria-label="result.screenAriaLabel">

            <span id="result-icon" class="result-icon" aria-hidden="true">💀</span>
            <h2 id="result-heading" data-i18n="result.gameOverTitle"></h2>
            <p id="result-message" class="subtitle"></p>

            <div class="final-score-block">
                <div class="final-score-number" id="final-score">0</div>
                <div class="final-score-caption" data-i18n="nickname.finalCaption"></div>
            </div>

            <form id="submit-form"
                  class="submit-form"
                  data-i18n-aria-label="submit.formAriaLabel"
                  novalidate>
                <label for="nickname-input">
                    <span data-i18n="nickname.labelPrefix"></span>
                    <span aria-hidden="true" style="color:var(--color-danger)"> *</span>
                </label>
                <div class="input-row">
                    <input type="text"
                           id="nickname-input"
                           name="nickname"
                           maxlength="20"
                           autocomplete="nickname"
                           data-i18n-placeholder="nickname.placeholder"
                           aria-required="true"
                           aria-describedby="nickname-hint submit-status"
                           pattern="[A-Za-z0-9_]{1,20}">
                    <button type="submit" class="btn-primary" id="btn-submit" data-i18n="nickname.submit"></button>
                </div>
                <p id="nickname-hint" class="sr-only" data-i18n="nickname.patternHintSr">
                </p>
                <div id="submit-status" role="status" aria-live="polite"></div>
            </form>

            <div class="action-row">
                <button type="button" id="btn-play-again" class="btn-primary" data-i18n="action.playAgain"></button>
                <button type="button" id="btn-main-menu"  class="btn-secondary" data-i18n="action.mainMenu"></button>
            </div>
        </section>

    </main>

    <script>
    (async () => {
        'use strict';

        const LOCALE_URL = new URL('locales/en.json', document.baseURI).href;
        const STRINGS = await fetch(LOCALE_URL).then(resp => {
            if (!resp.ok) {
                throw new Error(`Failed to load locales: HTTP ${resp.status}`);
            }
            return resp.json();
        });

        function t(key) {
            const val = STRINGS[key];
            if (typeof val !== 'string') {
                console.warn('Missing locale entry:', key);
                return key;
            }
            return val;
        }

        function format(template, vars) {
            let s = template;
            for (const [k, v] of Object.entries(vars)) {
                s = s.split(`{${k}}`).join(String(v));
            }
            return s;
        }

        function hydrateStaticStrings() {
            document.querySelector('meta[name="description"]')
                    ?.setAttribute('content', t('meta.description'));
            document.title = t('meta.pageTitle');
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.setAttribute('placeholder', t(el.dataset.i18nPlaceholder));
            });
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                el.setAttribute('title', t(el.dataset.i18nTitle));
            });
            document.querySelectorAll('[data-i18n-aria-label]').forEach(el => {
                el.setAttribute('aria-label', t(el.dataset.i18nAriaLabel));
            });
        }

        hydrateStaticStrings();

        // ── DOM refs ──────────────────────────────────────────────────────────
        const screenStart   = document.getElementById('screen-start');
        const screenGame    = document.getElementById('screen-game');
        const screenResult  = document.getElementById('screen-result');

        const canvas        = document.getElementById('game-canvas');
        const ctx           = canvas.getContext('2d');

        const scoreValue    = document.getElementById('score-value');
        const scoreAnn      = document.getElementById('score-announcer');
        const gameAnn       = document.getElementById('game-announcer');

        const resultHeading = document.getElementById('result-heading');
        const resultMsg     = document.getElementById('result-message');
        const resultIcon    = document.getElementById('result-icon');
        const finalScore    = document.getElementById('final-score');

        const btnStart      = document.getElementById('btn-start');
        const btnPause      = document.getElementById('btn-pause');
        const btnQuit       = document.getElementById('btn-quit');
        const btnPlayAgain  = document.getElementById('btn-play-again');
        const btnMainMenu   = document.getElementById('btn-main-menu');
        const btnSubmit     = document.getElementById('btn-submit');
        const submitForm    = document.getElementById('submit-form');
        const submitStatus  = document.getElementById('submit-status');
        const nicknameInput = document.getElementById('nickname-input');
        const contrastToggle= document.getElementById('contrast-toggle');

        // ── Helpers: screen management with focus ─────────────────────────────
        function showScreen(toShow, focusEl) {
            [screenStart, screenGame, screenResult].forEach(s => {
                const isShown = s === toShow;
                s.hidden = !isShown;
                s.setAttribute('aria-hidden', String(!isShown));
            });
            if (focusEl) {
                // Defer one tick so the element is visible before focusing
                requestAnimationFrame(() => focusEl.focus());
            }
        }

        // ── High-contrast toggle ──────────────────────────────────────────────
        contrastToggle.addEventListener('click', () => {
            const isHC = document.body.classList.toggle('high-contrast');
            contrastToggle.setAttribute('aria-pressed', String(isHC));
            // Re-draw canvas with updated colours
            if (gameRunning) drawFrame();
        });

        // ── Difficulty ────────────────────────────────────────────────────────
        const TICK_MS = { EASY: 150, MEDIUM: 100, HARD: 60 };
        const WIN_SCORE = 50;
        let difficulty  = 'EASY';

        function selectedDifficulty() {
            return document.querySelector('input[name="difficulty"]:checked')?.value ?? 'EASY';
        }

        // ── HiDPI canvas setup ────────────────────────────────────────────────
        // Scale the canvas backing store by devicePixelRatio so it renders
        // sharply on retina / high-DPI displays. The CSS size stays at 480px
        // (controlled by the stylesheet); only the internal resolution scales.
        const LOGICAL_SIZE = 480;
        function initCanvasResolution() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width  = LOGICAL_SIZE * dpr;
            canvas.height = LOGICAL_SIZE * dpr;
            ctx.scale(dpr, dpr);
        }
        initCanvasResolution();

        // ── Game state ────────────────────────────────────────────────────────
        const COLS = 20, ROWS = 20;
        const CELL = LOGICAL_SIZE / COLS;   // always based on logical pixels

        let snake, direction, nextDir, food, score, gameRunning, paused, loopId;

        function initGame() {
            snake     = [{ x: 10, y: 10 }];
            direction = { x: 1, y: 0 };
            nextDir   = { x: 1, y: 0 };
            score     = 0;
            paused    = false;
            gameRunning = true;
            placeFood();
            updateScoreDisplay(0);
            btnPause.textContent   = t('game.pauseInitial');
            btnPause.setAttribute('aria-pressed', 'false');
        }

        // Use crypto.getRandomValues() rather than Math.random() so the food
        // placement uses a cryptographically unpredictable source.
        function randInt(max) {
            const buf = new Uint32Array(1);
            crypto.getRandomValues(buf);
            return buf[0] % max;
        }

        function placeFood() {
            let pos;
            do {
                pos = { x: randInt(COLS), y: randInt(ROWS) };
            } while (snake.some(s => s.x === pos.x && s.y === pos.y));
            food = pos;
        }

        // ── Score ─────────────────────────────────────────────────────────────
        function updateScoreDisplay(newScore) {
            score = newScore;
            scoreValue.textContent = score;
            // Polite live region – announced without interrupting the user
            scoreAnn.textContent = format(t('announce.scoreUpdated'), { score });
        }

        // ── Game loop ─────────────────────────────────────────────────────────
        function tick() {
            if (!gameRunning || paused) return;

            direction = { ...nextDir };

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Wall collision
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                endGame(false); return;
            }
            // Self collision
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                endGame(false); return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                updateScoreDisplay(score + 1);
                if (score >= WIN_SCORE) { endGame(true); return; }
                placeFood();
            } else {
                snake.pop();
            }

            drawFrame();
        }

        function startLoop() {
            clearInterval(loopId);
            loopId = setInterval(tick, TICK_MS[difficulty]);
        }

        function stopLoop() {
            clearInterval(loopId);
        }

        // ── Touch / swipe input (mobile gameplay) ────────────────────────────
        // Minimum swipe distance in CSS pixels to register as intentional.
        const SWIPE_THRESHOLD = 20;
        let touchStartX = 0, touchStartY = 0;

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;
            if (!gameRunning || paused) return;

            let d;
            if (Math.abs(dx) >= Math.abs(dy)) {
                d = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
            } else {
                d = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
            }
            // Prevent 180° reversal
            if (d.x !== -direction.x || d.y !== -direction.y) nextDir = d;
        }, { passive: false });

        // ── Drawing ───────────────────────────────────────────────────────────
        const COLOR = {
            bg:     () => document.body.classList.contains('high-contrast') ? '#000' : '#0f172a',
            grid:   () => document.body.classList.contains('high-contrast') ? '#333' : '#1e293b',
            snake:  () => document.body.classList.contains('high-contrast') ? '#6bff6b' : '#4ade80',
            head:   () => document.body.classList.contains('high-contrast') ? '#a3ffaa' : '#86efac',
            food:   () => document.body.classList.contains('high-contrast') ? '#ff6b6b' : '#f87171',
            text:   () => document.body.classList.contains('high-contrast') ? '#fff'    : '#94a3b8',
        };

        function drawFrame() {
            const W = canvas.width, H = canvas.height;

            // Background
            ctx.fillStyle = COLOR.bg();
            ctx.fillRect(0, 0, W, H);

            // Subtle grid lines
            ctx.strokeStyle = COLOR.grid();
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= W; x += CELL) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
            for (let y = 0; y <= H; y += CELL) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

            // Food
            ctx.fillStyle = COLOR.food();
            ctx.beginPath();
            ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Snake segments
            snake.forEach((seg, i) => {
                ctx.fillStyle = i === 0 ? COLOR.head() : COLOR.snake();
                const r = 3;
                const x = seg.x * CELL + 1, y = seg.y * CELL + 1,
                      w = CELL - 2,          h = CELL - 2;
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
                ctx.fill();
            });

            // Pause overlay
            if (paused) {
                ctx.fillStyle = 'rgba(0,0,0,.65)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 32px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText(t('canvas.pausedHeading'), W / 2, H / 2 - 10);
                ctx.font = '14px system-ui';
                ctx.fillStyle = COLOR.text();
                ctx.fillText(t('canvas.pausedHint'), W / 2, H / 2 + 20);
            }
        }

        // ── End game ──────────────────────────────────────────────────────────
        function endGame(won) {
            gameRunning = false;
            stopLoop();

            // Assertive live region – interrupts the screen reader immediately
            gameAnn.textContent = won ? t('announce.youWin') : t('announce.gameOver');

            finalScore.textContent = score;
            submitStatus.textContent = '';
            submitStatus.className = '';
            nicknameInput.value = '';
            btnSubmit.disabled = false;

            if (won) {
                resultIcon.textContent    = '🏆';
                resultHeading.textContent = t('result.winTitle');
                resultMsg.textContent     = format(t('result.winBody'), { score, difficulty });
            } else {
                resultIcon.textContent    = '💀';
                resultHeading.textContent = t('result.gameOverTitle');
                resultMsg.textContent     = format(t('result.lossBody'), { score, difficulty });
            }

            showScreen(screenResult, resultHeading);
        }

        // ── Keyboard input ────────────────────────────────────────────────────
        const DIR_MAP = {
            ArrowUp:    { x: 0, y: -1 }, KeyW:       { x: 0, y: -1 },
            ArrowDown:  { x: 0, y:  1 }, KeyS:       { x: 0, y:  1 },
            ArrowLeft:  { x:-1, y:  0 }, KeyA:       { x:-1, y:  0 },
            ArrowRight: { x: 1, y:  0 }, KeyD:       { x: 1, y:  0 },
        };

        document.addEventListener('keydown', e => {
            // Global shortcuts
            if (e.code === 'KeyP' && screenGame && !screenGame.hidden) {
                e.preventDefault();
                togglePause();
                return;
            }
            if (e.code === 'KeyQ' && screenGame && !screenGame.hidden) {
                e.preventDefault();
                handleQuit();
                return;
            }

            const d = DIR_MAP[e.code];
            if (!d) return;

            // Prevent arrow keys from scrolling the page while playing
            if (!screenGame.hidden) e.preventDefault();

            if (!gameRunning || paused) return;
            // Prevent 180° reversal
            if (d.x !== -direction.x || d.y !== -direction.y) {
                nextDir = d;
            }
        });

        // ── Pause ─────────────────────────────────────────────────────────────
        function togglePause() {
            if (!gameRunning) return;
            paused = !paused;
            btnPause.textContent = paused ? t('game.resumeToggle') : t('game.pauseInitial');
            btnPause.setAttribute('aria-pressed', String(paused));
            if (paused) {
                stopLoop();
                gameAnn.textContent = t('announce.paused');
                drawFrame();
            } else {
                gameAnn.textContent = t('announce.resumed');
                startLoop();
            }
        }

        // ── Quit ──────────────────────────────────────────────────────────────
        function handleQuit() {
            gameRunning = false;
            stopLoop();
            showScreen(screenStart, btnStart);
        }

        // ── Button wiring ─────────────────────────────────────────────────────
        btnStart.addEventListener('click', () => {
            difficulty = selectedDifficulty();
            initGame();
            showScreen(screenGame, canvas);
            // Kick off the first draw then start the loop
            drawFrame();
            startLoop();
        });

        btnPause.addEventListener('click', togglePause);
        btnQuit.addEventListener('click', handleQuit);

        btnPlayAgain.addEventListener('click', () => {
            // Replay with same difficulty
            initGame();
            showScreen(screenGame, canvas);
            drawFrame();
            startLoop();
        });

        btnMainMenu.addEventListener('click', () => {
            showScreen(screenStart, btnStart);
        });

        // ── Score submission ──────────────────────────────────────────────────
        submitForm.addEventListener('submit', async e => {
            e.preventDefault();

            // Capture safe, validated values before any async work
            const rawNickname = nicknameInput.value.trim();
            const diff        = difficulty;          // one of EASY | MEDIUM | HARD
            const sc          = score;               // non-negative integer

            const NICKNAME_RE = /^[A-Za-z0-9_]{1,20}$/;
            if (!NICKNAME_RE.test(rawNickname)) {
                submitStatus.textContent = t('nickname.clientValidationError');
                submitStatus.className   = 'error';
                nicknameInput.focus();
                return;
            }

            // Snapshot validated value to ensure no mutation after validation
            const nickname = rawNickname;

            btnSubmit.disabled = true;
            submitStatus.textContent = '';
            submitStatus.className   = '';

            try {
                const res = await fetch('/api/v1/highscores', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname, score: sc, difficulty: diff })
                });

                if (res.ok) {
                    submitStatus.textContent = t('submit.success');
                    submitStatus.className   = 'success';
                } else {
                    const body = await res.json().catch(() => ({}));
                    submitStatus.textContent = body.message ?? t('submit.fallbackError');
                    submitStatus.className   = 'error';
                    btnSubmit.disabled = false;
                }
            } catch {
                submitStatus.textContent = t('submit.networkError');
                submitStatus.className   = 'error';
                btnSubmit.disabled = false;
            }
        });

        // ── CSS :has() polyfill for older browsers ────────────────────────────
        // Firefox < 121 and Safari < 15.4 do not support :has(). The .checked
        // class is toggled via JS so the selected difficulty is still visually
        // highlighted in those browsers.
        function updateDifficultyHighlight() {
            document.querySelectorAll('.difficulty-options label').forEach(label => {
                const input = label.querySelector('input');
                label.classList.toggle('checked', input ? input.checked : false);
            });
        }
        document.querySelectorAll('input[name="difficulty"]').forEach(input => {
            input.addEventListener('change', updateDifficultyHighlight);
        });
        updateDifficultyHighlight(); // apply on load

        // ── Init: show start screen ───────────────────────────────────────────
        showScreen(screenStart, btnStart);

    })();
    </script>
</body>
</html>
