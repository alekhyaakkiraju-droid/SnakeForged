apiVersion: apps/v1
kind: Deployment
metadata:
  name: snakeforged
  labels:
    app: snakeforged
    tenant: opsera
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snakeforged
  template:
    metadata:
      labels:
        app: snakeforged
        tenant: opsera
    spec:
      serviceAccountName: snakeforged
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: snakeforged
          image: PLACEHOLDER_ECR_URI:placeholder
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "8080"
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: snakeforged-config
                  key: SPRING_PROFILES_ACTIVE
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
      imagePullSecrets:
        - name: ecr-pull-secret
