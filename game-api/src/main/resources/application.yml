spring:
  application:
    name: snakeforged
  messages:
    basename: messages
    encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  datasource:
    url: jdbc:h2:file:./data/snakeforged;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      static-locations: classpath:/static/

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 4096

app:
  request:
    max-body-bytes: 4096
  metrics:
    # Override with OPERATOR_TOKEN env var in production. Used for HTTP Basic auth
    # on /actuator/prometheus so only authorised scrapers (e.g. Prometheus server)
    # can access metrics.
    operator-token: ${OPERATOR_TOKEN:changeme-dev-only}


ratelimit:
  highscore:
    requests-per-minute: 10
    window-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
